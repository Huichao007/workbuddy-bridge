name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: protocol tests (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: protocol and translation unit tests
        run: python -m unittest discover -s tests -v

  compile:
    name: syntax + hygiene
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: byte-compile every module
        run: |
          python -m py_compile bridge.py translate.py responses_api.py wbpaths.py instance.py
          python -m py_compile setup.py doctor.py smoke.py
          python -m py_compile tools/sync-opencode.py
          python -m py_compile clients/cursor-point-to-bridge.py
          python -m py_compile tests/test_translate.py

      - name: importable without a WorkBuddy install
        run: |
          python -c "import translate, responses_api, wbpaths, instance; print('ok')"

      - name: setup.py --help renders
        run: python setup.py --help

      - name: no syntax errors in PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $text, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PARSE ERROR in $($_.Name):"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $bad = 1
            } else {
              Write-Host "ok $($_.Name)"
            }
          }
          if ($bad) { exit 1 }

      - name: no secrets committed
        shell: pwsh
        run: |
          $hits = Get-ChildItem -Recurse -File -Include *.py,*.json,*.toml,*.md,*.ps1,*.cmd |
            Select-String -Pattern 'sk-[A-Za-z0-9]{20,}', 'Bearer\s+[A-Za-z0-9_\-\.]{30,}',
                                 'gho_[A-Za-z0-9]{20,}'
          if ($hits) { $hits | Format-Table; exit 1 } else { 'clean' }

      - name: machine-specific files are not committed
        shell: pwsh
        run: |
          foreach ($f in @('relay-models.json', 'instances.json')) {
            if (Test-Path $f) { throw "$f must stay git-ignored" }
          }
          'ok'

      - name: json files parse
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File -Include *.json |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
              try { Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null }
              catch { throw "invalid JSON: $($_.FullName)" }
            }
          'ok'

      - name: discoverability guard
        shell: pwsh
        run: |
          # The README is the product page. These facts are what make a visitor
          # decide to install; losing any of them silently kills the project's
          # only conversion path.
          $readme = Get-Content README.md -Raw
          $required = @{
            'OpenCode is named'          = 'OpenCode'
            'Codex is named'             = 'Codex'
            'one-command install'        = 'python setup.py'
            'a real command to run'      = 'opencode run -m'
            'a live verification step'   = 'python smoke.py'
          }
          $missing = @()
          foreach ($k in $required.Keys) {
            if ($readme -notmatch [regex]::Escape($required[$k])) { $missing += $k }
          }
          if (Test-Path README.en.md) {
            $en = Get-Content README.en.md -Raw
            foreach ($t in @('OpenCode', 'Codex', 'python setup.py', 'python smoke.py')) {
              if ($en -notmatch [regex]::Escape($t)) { $missing += "EN: $t" }
            }
          }
          if ($missing) { throw "README lost: $($missing -join ', ')" }
          'readme keeps its install story'
