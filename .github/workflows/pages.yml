name: pages

# Serves docs/ as the project's product page.
# Pages is configured with build_type=workflow, so this workflow is what
# actually publishes; enabling Pages alone would leave the site 404.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page ships what it promises
        run: |
          set -eu
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          test -f docs/assets/hero-diagram.png || { echo "hero diagram missing"; exit 1; }
          grep -q 'assets/hero-diagram.png' docs/index.html || { echo "page does not reference the diagram"; exit 1; }
          grep -qi 'opencode' docs/index.html || { echo "page lost the OpenCode story"; exit 1; }
          grep -qi 'codex' docs/index.html || { echo "page lost the Codex story"; exit 1; }
          echo "page content ok"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
